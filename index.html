<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmission Network of Sri Lanka – Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--navy:#1f3b57;--r220:#d7191c;--r132:#2b83ba;--bd:#e2e6ea;--mut:#6b7785}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:#1d2733}
#app{display:flex;height:100%}
#side{width:360px;min-width:360px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--bd);transition:margin .25s;z-index:1000}
#app.collapsed #side{margin-left:-360px}
header{background:var(--navy);color:#fff;padding:12px 14px 10px}
header h1{font-size:16px;margin:0 0 3px}
header .sub{font-size:12px;opacity:.85}
.tabs{display:flex;border-bottom:1px solid var(--bd);background:#f6f8fa}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);background:#fff}
.searchbox{position:relative;padding:10px 12px 6px}
.searchbox input{width:100%;padding:9px 34px 9px 12px;border:1px solid #c7cfd8;border-radius:8px;font:inherit;outline:none}
.searchbox input:focus{border-color:var(--navy);box-shadow:0 0 0 3px #1f3b5722}
.searchbox .clr{position:absolute;right:20px;top:15px;border:0;background:#e4e8ec;border-radius:50%;width:22px;height:22px;cursor:pointer;display:none;color:#444}
.chips{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.chip{border:1px solid #c7cfd8;background:#fff;border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hint{padding:0 12px 6px;color:var(--mut);font-size:12px}
#list{flex:1;overflow:auto;border-top:1px solid var(--bd)}
.grp{padding:7px 12px;background:#f1f4f7;font-weight:600;font-size:12px;color:#44505c;position:sticky;top:0;cursor:pointer;display:flex;justify-content:space-between;z-index:1;user-select:none}
.it{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f2f4;display:flex;align-items:center;gap:8px}
.it:hover{background:#eef5fc}
.it.sel{background:#dbeafb}
.it .t{flex:1;min-width:0}
.it .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{font-size:12px;color:var(--mut)}
.it .r{font-size:12px;color:var(--mut);white-space:nowrap;text-align:right}
.sw{display:inline-block;width:16px;height:4px;border-radius:2px;flex:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#111;border:2px solid #fff;box-shadow:0 0 0 1px #111;flex:none}
mark{background:#ffe58a;padding:0}
.empty{padding:24px 16px;color:var(--mut);text-align:center}
/* detail card */
#card{display:none;flex:1;border-top:1px solid var(--bd);background:#fbfcfd;overflow:auto}
#side.carded #list,#side.carded .searchbox,#side.carded .chips,#side.carded .hint.top,#side.carded .tabs{display:none!important}
.back{border:0;background:none;color:var(--navy);font:inherit;font-weight:600;cursor:pointer;padding:8px 12px;text-align:left;width:100%;border-bottom:1px solid var(--bd);background:#fff}
#card.line{display:flex!important;flex-direction:column;overflow:hidden}
#card.line .tw{flex:1;min-height:120px;max-height:none}
#card .hd{padding:10px 12px;display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--bd);background:#fff}
#card .hd b{flex:1;font-size:14px}
#card .x{border:0;background:#eef1f4;border-radius:6px;cursor:pointer;padding:3px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:8px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mut)}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:4px 12px 10px}
.btn{border:1px solid #c7cfd8;background:#fff;border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:#1d2733;text-decoration:none}
.btn:hover{background:#f1f4f7}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.goto{display:flex;gap:6px;padding:0 12px 10px}
.goto input{flex:1;padding:6px 8px;border:1px solid #c7cfd8;border-radius:6px;font:inherit}
.tw{max-height:220px;overflow:auto;margin:0 12px 12px;border:1px solid var(--bd);border-radius:6px;background:#fff}
.tw div{padding:4px 8px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #f3f4f6}
.tw div:hover{background:#eef5fc}
.tw div.cur{background:#ffe58a}
/* map */
#mapwrap{flex:1;position:relative}
#map{position:absolute;inset:0}
.fab{position:absolute;z-index:1000;background:#fff;border:0;border-radius:8px;box-shadow:0 1px 5px #0004;cursor:pointer;font:inherit;padding:8px 11px}
#toggle{top:10px;left:54px}
#legend{position:absolute;z-index:1000;left:10px;bottom:24px;background:#fffffff0;border-radius:8px;box-shadow:0 1px 5px #0003;padding:8px 10px;font-size:12px;line-height:1.7}
#legend .sw{width:20px;margin-right:6px;vertical-align:middle}
#legend label{cursor:pointer;display:flex;align-items:center;gap:4px}
.lbl{background:none;border:none;box-shadow:none;font-weight:600;font-size:11px;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-popup-content{font-size:13px;line-height:1.45;margin:10px 14px}
.pop h4{margin:0 0 4px;font-size:14px}
.pop .m{color:var(--mut)}
.pop .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.toast{position:absolute;z-index:2000;left:50%;bottom:30px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:700px){
 #side{position:absolute;top:0;bottom:0;left:0;width:88vw;min-width:0;box-shadow:2px 0 10px #0003}
 #app.collapsed #side{margin-left:-90vw}
 #legend{display:none}
}
</style></head><body>
<div id="app">
<aside id="side">
 <header><h1>⚡ Transmission Network of Sri Lanka</h1><div class="sub" id="stats"></div></header>
 <div class="tabs">

  <button data-tab="find">Find location</button>

 <div class="hint top" id="hint"></div>
 <div id="list"></div>
 <div id="card"></div>
</aside>
<div id="mapwrap">
 <div id="map"></div>

  <label><input type="checkbox" data-layer="towers" checked><span class="dot" style="background:#ff9900;box-shadow:0 0 0 1px #7a4a00;width:8px;height:8px;margin:0 10px 0 5px"></span>Towers (zoom in)</label>
 </div>
 <div class="toast" id="toast"></div>
</div>
</div>

/* ---------- data prep ---------- */
const lines=D.lines.map((l,i)=>{

 l.i=i; l.bounds=pts.length?L.latLngBounds(pts):null;

const subs=D.subs.map(([n,la,lo])=>({n,la,lo})).sort((a,b)=>a.n.localeCompare(b.n));
const key=s=>s.toLowerCase().replace(/\b(gss|ps|grid substation|substation|new|old|sub)\b/g,'').replace(/[^a-z]/g,'');
subs.forEach(s=>{
 const k=key(s.n);

/* route overview lines */
D.routes.forEach(r=>{
 const W=r.kv==='220'?3.5:2.5;

 pl.bindTooltip(`${esc(r.name)} · ${r.kv} kV`,{sticky:true});
 pl.on('click',e=>{ if(match){selectLine(match.i,true);} else L.popup().setLatLng(e.latlng).setContent(`<div class="pop"><h4>${esc(r.name)}</h4>${r.kv} kV line route</div>`).openOn(map);});

});
/* sections where 220 kV and 132 kV circuits share the same towers (e.g. Kirindiwela 4 cct):
   both voltages on -> red/blue stripes; only one on -> solid line of that voltage */
function drawShared(){
 layers.shared.clearLayers();
 const on220=document.querySelector('#legend input[data-layer="r220"]').checked, on132=document.querySelector('#legend input[data-layer="r132"]').checked;
 (D.shared||[]).forEach(s=>{
  const both=on220&&on132, tip=`${esc(s.name)}${both?'':on220?' · 220 kV':' · 132 kV'}`;
  const parts=[];
  if(on220) parts.push(L.polyline(s.c,{color:col('220'),weight:3.5,opacity:1}));
  if(on132) parts.push(L.polyline(s.c,both?{color:col('132'),weight:3.5,opacity:1,dashArray:'8 8',lineCap:'butt'}:{color:col('132'),weight:2.5,opacity:.9}));
  const W=on220?3.5:2.5;
  parts.forEach(pl=>{
   pl.bindTooltip(tip,{sticky:true});
   pl.on('click',()=>{const l=lines.find(x=>s.lines.includes(x.name)&&(on220&&x.kv==='220'||on132&&x.kv==='132'&&!on220)); if(l) selectLine(l.i,true);});
   pl.on('mouseover',()=>parts.forEach(p=>p.setStyle({weight:6})));pl.on('mouseout',()=>parts.forEach(p=>p.setStyle({weight:W})));
   pl.addTo(layers.shared);
  });
 });
}

   .bindTooltip(t[1]?'Tower '+esc(t[1]):'Tower '+t.seq,{direction:'top'}).on('click',()=>openTower(l.i,t.seq-1,false)).addTo(g));
 hlLayer=g.addTo(map);
 if(fit&&l.bounds) map.fitBounds(l.bounds,{padding:[40,40]});
 markListSel('L'+i); showLineCard(l);
}
function openTower(li,k,fly=true){
 const l=lines[li]; if(curLine!==l) selectLine(li,false);
 const t=l.t[k]; curTower=k;
 if(fly) map.setView([t[2],t[3]],Math.max(map.getZoom(),17));
 L.popup({maxWidth:320}).setLatLng([t[2],t[3]]).setContent(towerPopup(l,t)).openOn(map);
 document.querySelectorAll('#twlist div').forEach(d=>d.classList.toggle('cur',+d.dataset.k===k));
 const cur=document.querySelector('#twlist div.cur'); if(cur) cur.scrollIntoView({block:'nearest'});
}
window.stepTower=(li,k,d)=>{const l=lines[li];const n=k+d;if(n<0||n>=l.t.length){toast(n<0?'This is the first tower':'This is the last tower');return;}openTower(li,n,true);};
function selectSub(s,fly=true){
 if(fly) map.setView([s.la,s.lo],15);
 L.popup().setLatLng([s.la,s.lo]).setContent(`<div class="pop"><h4>${esc(s.n)}</h4><div class="m">Grid substation / switching station</div><div style="margin-top:4px">📍 ${fmt(s.la,s.lo)}</div>
  <div class="row"><button class="btn" onclick="copy('${s.la.toFixed(6)}, ${s.lo.toFixed(6)}')">Copy</button><a class="btn" target="_blank" href="${gmaps(s.la,s.lo)}">Google Maps</a><a class="btn" target="_blank" href="${gdir(s.la,s.lo)}">Directions</a></div></div>`).openOn(map);
 showSubCard(s); markListSel('S'+s.n);
}

/* ---------- detail cards ---------- */
function showLineCard(l){
 const c=$('#card'); c.style.display='block'; c.className=l.t.length?'line':''; $('#side').classList.add('carded');
 c.innerHTML=`<button class="back" onclick="clearSel()">← Back to list</button><div class="hd"><span class="sw" style="background:${col(l.kv)};margin-top:8px"></span><b>${esc(short(l.name))}</b><button class="x" onclick="clearSel()" title="Close">✕</button></div>
 <div class="kv"><span>Voltage</span><span>${l.kv} kV</span><span>Route length</span><span>≈ ${l.len.toFixed(1)} km</span>
  <span>Towers</span><span>${l.t.length}</span>${l.from?`<span>From</span><span>${esc(l.from)}</span>`:''}${l.to&&l.to!==l.from?`<span>To</span><span>${esc(l.to)}</span>`:''}</div>
 <div class="btns"><button class="btn pri" onclick="selectLine(${l.i},true)">Zoom to line</button>
  <button class="btn" onclick="openTower(${l.i},0)">First tower</button><button class="btn" onclick="openTower(${l.i},${l.t.length-1})">Last tower</button>
  <button class="btn" onclick="downloadCSV(${l.i})">⬇ Towers (Excel CSV)</button></div>
 ${l.t.length?`<div class="goto"><input id="goto" type="number" min="1" max="${l.t.length}" placeholder="Go to tower 1 – ${l.t.length}"><button class="btn" onclick="gotoTower()">Go</button></div>
 <div class="tw" id="twlist">${l.t.map((t,k)=>`<div data-k="${k}" onclick="openTower(${l.i},${k})"><span>${t[1]?'No. '+esc(t[1]):'Tower '+(k+1)}</span><span class="m">${t[4].toFixed(2)} km</span></div>`).join('')}</div>`:''}
 <div class="hint">Tower order is measured along the line${l.from?' starting from '+esc(l.from):''}. These are sequence numbers, not official tower numbers (the KMZ doesn't contain them for most lines).</div>`;
 const g=$('#goto'); if(g) g.onkeydown=e=>{if(e.key==='Enter')gotoTower();};
}
window.gotoTower=()=>{const v=parseInt($('#goto').value,10);if(!curLine||!(v>=1&&v<=curLine.t.length)){toast('Enter a number between 1 and '+(curLine?curLine.t.length:0));return;}openTower(curLine.i,v-1);};
function showSubCard(s){
 if(hlLayer){map.removeLayer(hlLayer);hlLayer=null;curLine=null;}
 const c=$('#card'); c.style.display='block'; c.className=''; $('#side').classList.add('carded');
 c.innerHTML=`<button class="back" onclick="clearSel()">← Back to list</button><div class="hd"><span class="dot" style="margin-top:4px"></span><b>${esc(s.n)}</b><button class="x" onclick="clearSel()">✕</button></div>
 <div class="kv"><span>Location</span><span>${fmt(s.la,s.lo)}</span></div>
 <div class="btns"><button class="btn" onclick="copy('${s.la.toFixed(6)}, ${s.lo.toFixed(6)}')">Copy coordinates</button><a class="btn" target="_blank" href="${gdir(s.la,s.lo)}">Directions</a></div>
 <div class="hint" style="font-weight:600;color:#44505c">Connected lines (${s.lines.length})</div>
 ${s.lines.length?s.lines.map(l=>`<div class="it" onclick="selectLine(${l.i},true)"><span class="sw" style="background:${col(l.kv)}"></span><div class="t"><div>${esc(short(l.name))}</div><div class="m">${l.kv} kV · ${l.t.length} towers</div></div></div>`).join(''):'<div class="empty">No matching circuits found in the tower file.</div>'}`;
}
window.downloadCSV=i=>{
 const l=lines[i]; const rows=[['Line','Voltage (kV)','Seq. No.','Official No.','Label','Latitude','Longitude','Chainage (km)']];
 l.t.forEach(t=>rows.push([short(l.name),l.kv,t.seq,t[1],t[0],t[2],t[3],t[4]]));
 const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=short(l.name).replace(/[^\w\- ]+/g,'_')+'_towers.csv';a.click();
};
window.clearSel=clearSel; window.selectLine=selectLine; window.openTower=openTower;

/* ---------- sidebar list ---------- */
let tab='lines', kvF='all'; const closed={};
const ph={lines:'Search lines… e.g. Kotmale, Victoria',subs:'Search substations… e.g. Biyagama',find:'Paste coordinates… e.g. 7.2906, 80.6337'};
function markListSel(id){document.querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));}
function render(){
 const q=$('#q').value.trim(); const ql=q.toLowerCase(); const list=$('#list'); let h='';
 $('#clr').style.display=q?'block':'none';
 $('#chips').style.display=tab==='lines'?'flex':'none';
 if(tab==='lines'){
  for(const kv of ['220','132']){
   if(kvF!=='all'&&kvF!==kv) continue;
   const ls=lines.filter(l=>l.kv===kv&&(!ql||l.name.toLowerCase().includes(ql)||(l.from+' '+l.to).toLowerCase().includes(ql)));
   if(!ls.length) continue;
   const g=kv+'kV', cl=closed[g]&&!ql;
   h+=`<div class="grp" data-g="${g}"><span>${cl?'▸':'▾'} ${kv} kV circuits</span><span>${ls.length}</span></div>`;
   if(!cl) ls.forEach(l=>h+=`<div class="it" data-id="L${l.i}" data-l="${l.i}"><span class="sw" style="background:${col(kv)}"></span><div class="t"><div>${hi(short(l.name),q)}</div><div class="m">${l.t.length} towers · ${l.len.toFixed(1)} km</div></div><span class="r">›</span></div>`);
  }
  $('#hint').textContent='Click a line to see its towers, length and details.';
 } else if(tab==='subs'){
  const ss=subs.filter(s=>!ql||s.n.toLowerCase().includes(ql));
  ss.forEach(s=>h+=`<div class="it" data-id="S${esc(s.n)}" data-s="${esc(s.n)}"><span class="dot"></span><div class="t"><div>${hi(s.n,q)}</div><div class="m">${s.lines.length} connected line${s.lines.length===1?'':'s'}</div></div><span class="r">›</span></div>`);
  $('#hint').textContent=`${ss.length} of ${subs.length} substations`;
 } else {
  $('#hint').innerHTML='Enter latitude, longitude (decimal degrees) to find the nearest tower and substation. Or <b>right-click anywhere on the map</b>, or press ◎ on the map to use your current location.';
  const m=q.match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
  if(m){let a=+m[1],b=+m[2]; if(a>50&&b<50)[a,b]=[b,a]; h=nearestHTML(a,b);}
 }
 list.innerHTML=h||(q&&tab!=='find'?`<div class="empty">No results for “${esc(q)}”.</div>`:'');
 if(curLine) markListSel('L'+curLine.i);
}
$('#list').onclick=e=>{
 const g=e.target.closest('.grp'); if(g){closed[g.dataset.g]=!closed[g.dataset.g];render();return;}
 const it=e.target.closest('.it'); if(!it) return;
 if(it.dataset.l!==undefined) selectLine(+it.dataset.l,true);
 else if(it.dataset.s!==undefined) selectSub(subs.find(s=>s.n===it.dataset.s));
 else if(it.dataset.tw) {const [li,k]=it.dataset.tw.split(',').map(Number);openTower(li,k);}
 else if(it.dataset.sub) selectSub(subs.find(s=>s.n===it.dataset.sub));
};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); tab=b.dataset.tab;
 $('#q').value=''; $('#q').placeholder=ph[tab]; render(); $('#q').focus();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));kvF=c.dataset.kv;render();});
$('#q').oninput=render;
$('#q').onkeydown=e=>{ if(e.key==='Enter'){const f=$('#list .it');if(f)f.click();} if(e.key==='Escape'){$('#q').value='';render();} };
$('#clr').onclick=()=>{$('#q').value='';render();$('#q').focus();};
$('#toggle').onclick=()=>{$('#app').classList.toggle('collapsed');setTimeout(()=>map.invalidateSize(),300);};

/* ---------- nearest tower ---------- */
function nearest(la,lo,n=5){
 const all=[]; lines.forEach(l=>l.t.forEach((t,k)=>all.push([hav(la,lo,t[2],t[3]),l,k])));
 all.sort((a,b)=>a[0]-b[0]); return all.slice(0,n);
}
function nearestHTML(la,lo){
 pinLayer.clearLayers(); L.marker([la,lo]).addTo(pinLayer); map.setView([la,lo],Math.max(map.getZoom(),14));
 const nt=nearest(la,lo,5); const ns=subs.map(s=>[hav(la,lo,s.la,s.lo),s]).sort((a,b)=>a[0]-b[0]).slice(0,3);
 const d=x=>x<1?Math.round(x*1000)+' m':x.toFixed(1)+' km';
 let h=`<div class="grp"><span>📍 ${fmt(la,lo)}</span></div><div class="grp"><span>Nearest towers</span></div>`;
 nt.forEach(([dk,l,k])=>{const t=l.t[k];h+=`<div class="it" data-tw="${l.i},${k}"><span class="sw" style="background:${col(l.kv)}"></span><div class="t"><div>${t[1]?'Tower '+esc(t[1]):'Tower '+(k+1)} – ${esc(short(l.name))}</div><div class="m">${l.kv} kV</div></div><span class="r">${d(dk)}</span></div>`;});
 h+=`<div class="grp"><span>Nearest substations</span></div>`;
 ns.forEach(([dk,s])=>h+=`<div class="it" data-sub="${esc(s.n)}"><span class="dot"></span><div class="t"><div>${esc(s.n)}</div></div><span class="r">${d(dk)}</span></div>`);
 return h;
}
function showFind(la,lo){
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='find')); tab='find';
 $('#q').placeholder=ph.find; $('#q').value=`${la.toFixed(6)}, ${lo.toFixed(6)}`; render();
 if($('#app').classList.contains('collapsed')) $('#toggle').click();
}
map.on('contextmenu',e=>showFind(e.latlng.lat,e.latlng.lng));
function locateMe(){
 if(!navigator.geolocation){toast('Location not available in this browser');return;}
 toast('Finding your location…');
 navigator.geolocation.getCurrentPosition(p=>showFind(p.coords.latitude,p.coords.longitude),()=>toast('Could not get your location (permission denied?)'),{enableHighAccuracy:true,timeout:15000});
}
map.on('keydown',e=>{if(e.originalEvent.key==='Escape')clearSel();});

/* ---------- start ---------- */
const nT=lines.reduce((a,l)=>a+l.t.length,0);
$('#stats').textContent=`${subs.length} substations · ${lines.filter(l=>l.kv==='220').length} × 220 kV + ${lines.filter(l=>l.kv==='132').length} × 132 kV circuits · ${nT.toLocaleString()} towers`;
$('#q').placeholder=ph.lines; render(); map.fitBounds(HOME);
if(window.innerWidth<=700) $('#app').classList.add('collapsed');
</script></body></html>
